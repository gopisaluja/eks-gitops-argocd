{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sample-api.serviceAccountName" . }}
  labels:
    {{- include "sample-api.labels" . | nindent 4 }}
  {{- $annotations := deepCopy (.Values.serviceAccount.annotations | default dict) }}
  {{- with .Values.serviceAccount.irsaRoleArn }}
  {{- $_ := set $annotations "eks.amazonaws.com/role-arn" . }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
