# Declarative registration of an EKS cluster in Argo CD (one Secret per cluster).
# Argo CD authenticates with IAM (awsAuthConfig), so this file holds no
# credentials and can live in Git.
#
#   Argo CD pods --IRSA--> eks-mgmt-argocd (hub role, mgmt account)
#                --sts:AssumeRole--> argocd-deployer (target account)
#                --EKS access entry--> cluster admin on eks-dev
#
# The access entry for argocd-deployer comes from cluster_admin_role_arns in
# infra/terraform; the deployer role and its trust policy belong to the
# account baseline and are not created here.
#
# Fill server/caData from: terraform output cluster_endpoint / cluster_certificate_authority_data
apiVersion: v1
kind: Secret
metadata:
  name: cluster-eks-dev
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    env: dev
type: Opaque
stringData:
  name: eks-dev
  server: https://EXAMPLED539D4633E53DE1B71EXAMPLE.gr7.us-east-1.eks.amazonaws.com
  config: |
    {
      "awsAuthConfig": {
        "clusterName": "eks-dev",
        "roleARN": "arn:aws:iam::111122223333:role/argocd-deployer"
      },
      "tlsClientConfig": {
        "insecure": false,
        "caData": "<base64-encoded-cluster-ca>"
      }
    }
