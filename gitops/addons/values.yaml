# Platform add-on catalogue shared by every environment.
# values-<env>.yaml overlays this file (Helm deep-merges maps, replaces lists).
#
# Sync waves (lower first; each wave waits for the previous one to be Healthy,
# see the Application health check in gitops/bootstrap/argocd-values.yaml):
#   -1  prometheus-operator-crds   CRDs (ServiceMonitor, PrometheusRule) used by later waves
#    0  cert-manager, metrics-server
#    1  ingress-nginx, external-dns, platform-config (ClusterIssuers need cert-manager's webhook)
#    2  kube-prometheus-stack      (PVCs use the gp3 StorageClass from platform-config)

# Set by the platform-addons ApplicationSet.
env: ""
cluster: ""
repoURL: https://github.com/gopisaluja/eks-gitops-argocd.git
targetRevision: main

addons:
  prometheus-operator-crds:
    enabled: true
    syncWave: "-1"
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-operator-crds
    version: 32.0.1 # matches the operator version in kube-prometheus-stack 91.9.0
    namespace: monitoring
    # CRDs exceed the client-side apply annotation size limit.
    syncOptions:
      - ServerSideApply=true

  cert-manager:
    enabled: true
    syncWave: "0"
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    version: v1.21.2
    namespace: cert-manager
    values:
      crds:
        enabled: true
        keep: true
      serviceAccount:
        name: cert-manager # must match the IRSA trust in infra/terraform/irsa.tf
      prometheus:
        enabled: true
        servicemonitor:
          enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 64Mi

  metrics-server:
    enabled: true
    syncWave: "0"
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    version: 3.14.0
    namespace: kube-system
    values:
      metrics:
        enabled: true
      serviceMonitor:
        enabled: true

  ingress-nginx:
    enabled: true
    syncWave: "1"
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    version: 4.15.1
    namespace: ingress-nginx
    values:
      controller:
        replicaCount: 2
        ingressClassResource:
          name: nginx
          default: true
        service:
          externalTrafficPolicy: Local # preserve client source IPs
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-type: nlb
        metrics:
          enabled: true
          serviceMonitor:
            enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
    # The admission webhook's caBundle is patched in-cluster after install.
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        jqPathExpressions:
          - .webhooks[]?.clientConfig.caBundle
    syncOptions:
      - RespectIgnoreDifferences=true

  external-dns:
    enabled: true
    syncWave: "1"
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    version: 1.22.0
    namespace: external-dns
    values:
      provider:
        name: aws
      serviceAccount:
        name: external-dns # must match the IRSA trust in infra/terraform/irsa.tf
      sources:
        - service
        - ingress
      registry: txt
      policy: upsert-only
      serviceMonitor:
        enabled: true

  platform-config:
    enabled: true
    syncWave: "1"
    # Plain manifests from this repo (StorageClass, ClusterIssuers).
    path: gitops/platform-config
    namespace: cert-manager

  kube-prometheus-stack:
    enabled: true
    syncWave: "2"
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    version: 91.9.0
    namespace: monitoring
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration
        jqPathExpressions:
          - .webhooks[]?.clientConfig.caBundle
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        jqPathExpressions:
          - .webhooks[]?.clientConfig.caBundle
    values:
      crds:
        enabled: false # owned by prometheus-operator-crds (wave -1)
      # The EKS control plane is managed by AWS and not scrapeable.
      kubeControllerManager:
        enabled: false
      kubeScheduler:
        enabled: false
      kubeEtcd:
        enabled: false
      # kube-proxy on EKS binds metrics to localhost.
      kubeProxy:
        enabled: false
      prometheus:
        prometheusSpec:
          # Pick up ServiceMonitors/rules from every add-on, not only this release.
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          ruleSelectorNilUsesHelmValues: false
          probeSelectorNilUsesHelmValues: false
          retention: 3d
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: gp3
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 20Gi
      grafana:
        # Helm test hooks are not useful under Argo CD; don't render the test Pod.
        testFramework:
          enabled: false
        # Never let the chart generate a random password: it changes on every
        # render and Argo CD reports permanent drift. The Secret is delivered
        # out of band (External Secrets Operator / SOPS, see README).
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
